{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li class="masthead__menu-item">
            <span id="dark-mode-toggle" onclick="toggleDark()" style="cursor:pointer; font-size:1.1em;">🌙</span>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
<script>
function toggleDark() {
  var body = document.body;
  var toggle = document.getElementById('dark-mode-toggle');
  if (body.classList.contains('dark-mode')) {
    body.classList.remove('dark-mode');
    localStorage.setItem('darkMode', 'false');
    toggle.textContent = '🌙';
  } else {
    body.classList.add('dark-mode');
    localStorage.setItem('darkMode', 'true');
    toggle.textContent = '☀️';
  }
}
if (localStorage.getItem('darkMode') === 'true') {
  document.body.classList.add('dark-mode');
  document.addEventListener('DOMContentLoaded', function() {
    var t = document.getElementById('dark-mode-toggle');
    if (t) t.textContent = '☀️';
  });
}
</script>
